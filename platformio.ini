[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7
build_flags =
    ; Your location: weather coordinates and a POSIX timezone (default Bangkok, UTC+7).
    ; Timezone strings: https://github.com/nayarsystems/posix_tz_db/blob/master/zones.csv
    -DWEATHER_LAT=13.7563
    -DWEATHER_LON=100.5018
    '-DTZ_POSIX="ICT-7"'
    -DUSER_SETUP_LOADED
    -DILI9341_2_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_INVERSION_ON
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT7
    -DSMOOTH_FONT
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000

[env:native]
platform = native
test_framework = unity
lib_deps = bblanchon/ArduinoJson@^7
build_src_filter = -<*>

[env:cyd_demo]
extends = env:cyd
build_flags = ${env:cyd.build_flags} -DDEMO_MODE
